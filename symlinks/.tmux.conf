# remap prefix to Control + a
set -g prefix C-a
# bind 'C-a C-a' to type 'C-a'
bind C-a send-prefix
unbind C-b

# tmux-256color (vs. the old screen-256color) advertises the terminal's real
# capabilities to programs inside tmux: 256 colors, italics, and correct
# Meta/extended-key handling. Requires the tmux-256color terminfo entry.
set -g default-terminal "tmux-256color"

# Let true-color (24-bit) escapes pass through to the outer terminal (iTerm2).
set -ga terminal-overrides ",xterm-256color:Tc,iterm2:Tc"

# Register Meta/Alt (Esc-prefixed) keys instantly instead of after the default
# 500ms, so Alt-<key> works without lag and isn't misread as a bare Escape.
# Requires iTerm2's Option Key to be set to "Esc+" (Settings > Profiles > Keys).
set -sg escape-time 10

# Refresh SSH_CLIENT/SSH_TTY on each client attach (they're not in tmux's default
# update-environment list). Otherwise, if the tmux server was first started over
# SSH, these stay stale in every pane -- even local attaches -- which makes tools
# like powerlevel10k wrongly think a local session is remote.
#
# SSH_AUTH_SOCK is deliberately REMOVED from the default list: shells use the
# stable symlink ~/.ssh/ssh_auth_sock instead (see ~/.profile.d/50-ssh-agent.sh),
# which ~/.ssh/rc (on SSH connect) / local shells (1Password) keep pointed at a
# live socket. Letting tmux copy the raw per-connection /tmp/ssh-*/agent.* path
# back into the session env would reintroduce stale sockets after a disconnect.
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_CONNECTION SSH_CLIENT SSH_TTY WINDOWID XAUTHORITY"
set-environment -g SSH_AUTH_SOCK "$HOME/.ssh/ssh_auth_sock"

# Stolen from: https://github.com/martyn/dvorak-conf/blob/master/tmux/tmux.conf
setw -g mode-keys vi
unbind-key j
bind-key t select-pane -D
unbind-key k
bind-key n select-pane -U
unbind-key h
bind-key h select-pane -L
unbind-key l
bind-key s select-pane -R

# ---------------------------------------------------------------------------
# Window numbering: start at 1 (both windows and panes), and renumber so there
# are never gaps after closing one.
# ---------------------------------------------------------------------------
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on

# Pass modified keys (Shift-Enter, etc.) through to apps like Claude Code using
# the CSI-u / extended-keys protocol. Also run `/terminal-setup` once inside
# Claude Code so iTerm2 emits the Shift-Enter sequence in the first place.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ---------------------------------------------------------------------------
# Window naming.
#   Claude panes: Claude Code sets the pane title to the session name (plus a
#     leading braille spinner while working, or "awaiting input" when it needs
#     you). We detect a Claude pane by its process name being a version string
#     (e.g. "2.1.219") and use that pane title — with the animating spinner
#     stripped (`s/^[braille]+ //`) so the tab name stays stable. This is the
#     only thing that works for Claude's *background* sessions, which aren't
#     attached to a tmux pane (so a hook can't rename their window).
#   Everything else: the running command, or the directory basename at a bare
#     shell (pane_current_command == zsh).
# ---------------------------------------------------------------------------
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{m:*[0-9].[0-9]*,#{pane_current_command}},#{s/^[⠀-⣿]+ //:pane_title},#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}}'

# ---------------------------------------------------------------------------
# Status line. Lightweight, flat blocks (no Powerline separator glyphs — the
# Nerd Font Mono variant doesn't render them cleanly). Palette:
#   primary  #5f8fff (blue)   active-window highlight  #ffffff (white)
#   prefix   #87d75f (green)  — the session block flips to this while the tmux
#                              prefix (C-a) is held, so you can see it's armed.
#   attention #ff5f5f (red)   — a window Claude is waiting on ("awaiting input"
#                              in the title, or a "!" prefix) shows red, even
#                              unfocused.
# Swap the hex values below to re-theme; that's the only thing to touch.
# ---------------------------------------------------------------------------
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#7a7a7a"
set -g status-left-length 40
set -g status-right-length 60

# Session name, bottom-left. Flips blue -> green while the prefix is held.
# `#{s/-[0-9]+$//:session_name}` strips tmux's session-group suffix (e.g. the
# "-1" in "reframe-1") so the display shows the clean base name.
set -g status-left "#[fg=#0b0b0b,bg=#{?client_prefix,#87d75f,#5f8fff},bold] #{s/-[0-9]+$//:session_name} #[fg=default,bg=default]"

# Window tabs. Inactive: dim (red if Claude is awaiting input). Active: white block.
# Red when the name matches "*awaiting*" (Claude needs input) or starts with "!".
setw -g window-status-separator ""
setw -g window-status-format         "#[fg=#{?#{m:*awaiting*,#W},#ff5f5f,#{?#{m:!*,#W},#ff5f5f,#7a7a7a}},bg=default] #I #W #[default]"
setw -g window-status-current-format "#[fg=#0b0b0b,bg=#{?#{m:*awaiting*,#W},#ff5f5f,#{?#{m:!*,#W},#ff5f5f,#ffffff}},bold] #I #W #[default]"

# Right side: hostname (only over SSH) + clock, dim.
set -g status-right "#{?SSH_CONNECTION,#[fg=#87d75f] #h ,}#[fg=#7a7a7a] %H:%M "
